services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbcr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbcr_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-cbcr}
    ports:
      - "5432:5432"
    volumes:
      - cbcr_pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cbcr:cbcr_dev_only@db:5432/cbcr
      CORS_ORIGINS: http://localhost:5173,http://47.253.231.221:5173
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    depends_on:
      - db
    ports:
      - "8000:8000"
  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://47.253.231.221:8000/api/v1
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
volumes:
  cbcr_pgdata:
